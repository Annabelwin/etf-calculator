<style>
    :root{
      --bg:#eef2f6;
      --surface:#ffffff;
      --surface-2:#f7f9fc;
      --text:#18202a;
      --muted:#667085;
      --line:#d9e0e8;
      --line-strong:#cbd5e1;
      --shadow:0 20px 50px rgba(15,23,42,0.08);
      --radius:24px;
      --radius-sm:18px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      width:min(980px, calc(100% - 56px));
      margin:0 auto;
      padding:32px 0 52px;
    }

    .section-card{
      background:rgba(255,255,255,0.88);
      backdrop-filter:blur(10px);
      border:1px solid rgba(210,218,230,0.9);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:40px 38px;
      margin:0 0 22px;
    }

    .hero{
      text-align:center;
      padding:54px 42px 40px;
    }

    .eyebrow{
      display:inline-block;
      font-size:11px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#7a8798;
      margin-bottom:12px;
    }

    .hero h1,
    .section-title{
      margin:0;
      font-size:clamp(2rem,4vw,3.35rem);
      line-height:1.04;
      letter-spacing:-0.04em;
      text-wrap:balance;
    }

    .hero-sub{
      max-width:760px;
      margin:14px auto 0;
      font-size:1.03rem;
      color:var(--muted);
      text-wrap:balance;
    }

    .hero-note{
      max-width:760px;
      margin:12px auto 0;
      font-size:.93rem;
      color:#8a94a3;
      text-wrap:balance;
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-top:24px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 18px;
      border-radius:999px;
      border:1px solid var(--line-strong);
      font-size:.95rem;
      font-weight:700;
      transition:all .18s ease;
      background:#fff;
      color:var(--text);
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:#b8c4d3;
      box-shadow:0 10px 24px rgba(15,23,42,0.08);
    }

    .btn-primary{
      background:#44526a;
      color:#fff;
      border-color:#44526a;
    }

    .btn-primary:hover{
      background:#3a475c;
      border-color:#3a475c;
    }

    .inline-links{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:16px;
      margin-top:16px;
      font-size:.88rem;
      color:#7b8796;
    }

    .inline-links a{
      font-weight:600;
    }

    .section-head{
      text-align:center;
      margin-bottom:18px;
    }

    .section-head h2{
      margin:0;
      font-size:clamp(1.7rem,3vw,2.55rem);
      line-height:1.1;
      letter-spacing:-0.035em;
      text-wrap:balance;
    }

    .section-head p{
      max-width:760px;
      margin:10px auto 0;
      color:var(--muted);
      font-size:.98rem;
      text-wrap:balance;
    }

    .decision-flow{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin:6px 0 20px;
      font-size:.82rem;
      font-weight:700;
      color:#6f7c8d;
    }

    .flow-arrow{
      color:#9aa5b3;
      font-weight:800;
    }

    .grid-2{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:16px;
    }

    .feature-card,
    .decision-card,
    .fit-card,
    .list-card,
    .principle-card,
    .cta-card{
      background:linear-gradient(180deg,#ffffff 0%, #f8fafc 100%);
      border:1px solid #dde5ee;
      border-radius:22px;
      padding:26px 24px;
      min-height:100%;
      transition:all .18s ease;
    }

    .feature-card:hover,
    .decision-card:hover,
    .fit-card:hover,
    .list-card:hover,
    .principle-card:hover,
    .cta-card:hover{
      transform:translateY(-2px);
      border-color:#c9d4e0;
      box-shadow:0 12px 28px rgba(15,23,42,0.07);
    }

    .card-label{
      display:block;
      font-size:10px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#7f8a99;
      margin-bottom:10px;
    }

    .feature-card h3,
    .decision-card h3,
    .fit-card h3,
    .list-card h3,
    .principle-card h3,
    .cta-card h3{
      margin:0 0 10px;
      font-size:1.18rem;
      line-height:1.16;
      letter-spacing:-0.02em;
      text-wrap:balance;
    }

    .feature-card p,
    .decision-card p,
    .fit-card p,
    .list-card p,
    .principle-card p,
    .cta-card p{
      margin:0;
      font-size:.94rem;
      line-height:1.72;
      color:var(--muted);
    }

    .card-link{
      display:inline-block;
      margin-top:14px;
      font-weight:700;
      font-size:.92rem;
      color:#344256;
      transition:transform .16s ease,color .16s ease;
    }

    .feature-card:hover .card-link,
    .decision-card:hover .card-link,
    .fit-card:hover .card-link,
    .list-card:hover .card-link,
    .principle-card:hover .card-link,
    .cta-card:hover .card-link{
      transform:translateX(2px);
      color:#223247;
    }

    .micro-note{
      text-align:center;
      margin-top:14px;
      font-size:.84rem;
      color:#7d8897;
      text-wrap:balance;
    }

    .quick-answer{
      max-width:800px;
      margin:0 auto;
    }

    .quick-answer-box{
      background:linear-gradient(180deg,#ffffff 0%, #f7fafd 100%);
      border:1px solid #dbe4ee;
      border-radius:22px;
      padding:24px 24px 22px;
      text-align:center;
    }

    .quick-answer-box h3{
      margin:0;
      font-size:1.42rem;
      line-height:1.14;
      letter-spacing:-0.028em;
      text-wrap:balance;
    }

    .quick-answer-box p{
      max-width:720px;
      margin:12px auto 0;
      font-size:.97rem;
      color:var(--muted);
      text-wrap:balance;
    }

    .answer-pills{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:18px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      min-height:36px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid #d9e1ea;
      background:#fff;
      color:#536071;
      font-size:.85rem;
      font-weight:700;
    }

    .fit-list{
      margin:12px 0 0;
      padding-left:18px;
      color:var(--muted);
      font-size:.93rem;
    }

    .fit-list li{
      margin:8px 0;
    }

    .impact-line{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #e5ebf2;
      font-size:.84rem;
      line-height:1.45;
      color:#738092;
    }

    .impact-line strong{
      color:#334155;
    }

    .route-links{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .footer-feedback{
      text-align:center;
      color:#7e8a99;
      font-size:.83rem;
      margin-top:18px;
    }

    .footer-feedback a{
      font-weight:700;
      color:#4d5b70;
    }

    @media (max-width: 980px){
      .grid-4{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .grid-3,
      .grid-2,
      .route-links{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 640px){
      .page{
        width:min(980px, calc(100% - 20px));
        padding:18px 0 34px;
      }

      .section-card{
        border-radius:22px;
        padding:28px 18px;
        margin-bottom:16px;
      }

      .hero{
        padding:36px 20px 26px;
      }

      .hero-actions{
        flex-direction:column;
        align-items:stretch;
      }

      .btn{
        width:100%;
      }

      .inline-links{
        gap:10px 14px;
        font-size:.84rem;
      }

      .grid-4{
        grid-template-columns:1fr;
      }

      .feature-card,
      .decision-card,
      .fit-card,
      .list-card,
      .principle-card,
      .cta-card{
        padding:22px 18px 20px;
      }

      .decision-flow{
        gap:8px;
        font-size:.78rem;
        margin-bottom:16px;
      }

      .hero h1,
      .section-title{
        font-size:clamp(2.15rem,4.2vw,3.55rem);
        line-height:1.08;
      }

      .section-head h2{
        font-size:clamp(1.55rem,6vw,2rem);
      }
    }
  </style>
