<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      max-width: 520px;
      width: 100%;
      border: 1px solid #e5e7eb;
    }

    h2 {
      margin: 0 0 12px;
      color: #0f172a;
      font-size: 2rem;
    }

    p {
      color: #64748b;
      margin: 0 0 20px;
      line-height: 1.7;
    }

    .subtext {
      font-size: 0.98rem;
      margin-bottom: 24px;
    }

    .tool-links {
      display: grid;
      gap: 12px;
      margin: 20px 0 26px;
    }

    .primary-link,
    .secondary-link {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .primary-link {
  background: #1e40af;
  color: #ffffff;
}

.primary-link:hover {
  background: #1d4ed8;
}

    .secondary-link {
      background: #f8fafc;
      color: #0f172a;
      border: 1px solid #e5e7eb;
    }

    .secondary-link:hover {
      background: #eef2f7;
    }

    .back-home {
      display: inline-block;
      margin-top: 4px;
      color: #475569;
      text-decoration: none;
      font-weight: 600;
    }

    .back-home:hover {
      color: #0f172a;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Thanks for your feedback 🙌</h2>
    <p>We’ve received your message and will review it shortly.</p>
    <p class="subtext">You can continue exploring our most useful ETF tools below.</p>

    <div class="tool-links">
      <a class="primary-link" href="/etf-calculator.html">Open ETF Calculator</a>
      <a class="primary-link" href="/voo-calculator.html">Open VOO Calculator</a>
      <a class="secondary-link" href="/etf-comparisons.html">Explore ETF Comparisons</a>
    </div>

    <a class="back-home" href="/">Back to Home</a>
  </div>
</body>
</html>
