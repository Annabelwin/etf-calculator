<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 420px;
    }

    h2 {
      margin-bottom: 12px;
      color: #0f172a;
    }

    p {
      color: #64748b;
      margin-bottom: 24px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Thanks for your feedback 🙌</h2>
    <p>We’ve received your message and will review it shortly.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
