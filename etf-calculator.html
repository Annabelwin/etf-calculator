<!DOCTYPE html>
<html>
<head>
 <title>ETF Calculator | Estimate Long-Term ETF Investment Growth</title>
<meta name="description" content="Use this free ETF calculator to estimate long-term ETF investment growth with monthly contributions, projected returns, and visual charts.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#f7f7f8 0%, #eceef1 100%);
      text-align:center;
      padding:40px 20px;
      color:#16181d;
    }

    .container{
      background:linear-gradient(180deg,#ffffff 0%, #f3f4f6 100%);
      max-width:820px;
      margin:auto;
      padding:30px 30px 26px 30px;
      border-radius:22px;
      box-shadow:
        0 20px 50px rgba(15,23,42,0.10),
        inset 0 1px 0 rgba(255,255,255,0.9);
      border:1px solid rgba(148,163,184,0.18);
    }

    h1{
      margin-bottom:8px;
      font-size:44px;
      letter-spacing:-1px;
      color:#111827;
    }

    .sub{
      color:#6b7280;
      margin-bottom:22px;
      font-size:16px;
    }

    .form-box{
      max-width:460px;
      margin:0 auto 6px auto;
    }

    input{
      width:100%;
      padding:14px 16px;
      margin:8px 0;
      border-radius:12px;
      border:1px solid #d6dae1;
      font-size:16px;
      box-sizing:border-box;
      background:rgba(255,255,255,0.92);
      color:#111827;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
    }

    input:focus{
      outline:none;
      border-color:#7c8aa0;
      box-shadow:0 0 0 3px rgba(148,163,184,0.18);
    }

    .button-group{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    button{
      flex:1;
      padding:14px;
      border:none;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
      transition:all 0.18s ease;
    }

    .primary-btn{
      background:linear-gradient(180deg,#5b6c85 0%, #2f3c4f 100%);
      color:white;
      box-shadow:
        0 10px 20px rgba(31,41,55,0.18),
        inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .primary-btn:hover{
      transform:translateY(-1px);
      background:linear-gradient(180deg,#64748b 0%, #334155 100%);
    }

    .secondary-btn{
      background:linear-gradient(180deg,#f8fafc 0%, #e5e7eb 100%);
      color:#374151;
      border:1px solid rgba(148,163,184,0.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .secondary-btn:hover{
      transform:translateY(-1px);
      background:linear-gradient(180deg,#ffffff 0%, #eaeef3 100%);
    }

    .result-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:20px;
    }

    .stat{
      background:linear-gradient(180deg,#f9fafb 0%, #eef2f7 100%);
      border:1px solid rgba(148,163,184,0.16);
      border-radius:16px;
      padding:16px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .stat-label{
      font-size:13px;
      color:#6b7280;
      margin-bottom:8px;
    }

    .stat-value{
      font-size:22px;
      font-weight:700;
      color:#111827;
      word-break:break-word;
    }

    .chart-card{
      margin-top:18px;
      background:linear-gradient(180deg,#ffffff 0%, #f8fafc 100%);
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(148,163,184,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .chart-title{
      text-align:left;
      font-size:15px;
      font-weight:600;
      color:#374151;
      margin-bottom:8px;
    }

    .back{
      margin-top:20px;
      display:inline-block;
      color:#475569;
      text-decoration:none;
      font-weight:600;
    }

    .back:hover{
      color:#111827;
    }

    @media (max-width: 760px){
      .container{
        padding:22px;
      }

      h1{
        font-size:36px;
      }

      .result-grid{
        grid-template-columns:1fr;
      }

      .button-group{
        flex-direction:column;
      }

      .stat-value{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ETF Calculator</h1>
    <div class="sub">Estimate long-term ETF growth with a clean, professional view.</div>

    <div class="form-box">
      <input id="initial" placeholder="Initial Investment ($)" value="10000">
      <input id="monthly" placeholder="Monthly Investment ($)" value="500">
      <input id="years" placeholder="Years" value="20">
      <input id="rate" placeholder="Annual Return (%)" value="8">

      <div class="button-group">
        <button class="primary-btn" onclick="calculate()">Calculate</button>
        <button class="secondary-btn" onclick="tryExample()">Try Example</button>
        <button class="secondary-btn" onclick="resetForm()">Reset</button>
      </div>
    </div>

    <div class="result-grid">
      <div class="stat">
        <div class="stat-label">Final Value</div>
        <div class="stat-value" id="finalValue">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Contributions</div>
        <div class="stat-value" id="contributions">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Growth</div>
        <div class="stat-value" id="growth">—</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Investment Growth Over Time</div>
      <canvas id="chart"></canvas>
    </div>

    <a class="back" href=" ">← Back to Home</a >

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    let growthChart = null;

    function money(n){
      return "$" + Number(n).toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function drawChart(data){
      const ctx = document.getElementById("chart");

      if (growthChart) {
        growthChart.destroy();
      }

      growthChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: data.labels,
          datasets: [
            {
              label: "Total Value",
              data: data.totalValues,
              borderColor: "#3b82f6",
              backgroundColor: "rgba(59,130,246,0.08)",
              fill: false,
              tension: 0.32,
              borderWidth: 3,
              pointRadius: 2
            },
            {
              label: "Contributions",
              data: data.contributionValues,
              borderColor: "#94a3b8",
              backgroundColor: "rgba(148,163,184,0.06)",
              fill: false,
              tension: 0.2,
              borderWidth: 2,
              pointRadius: 1
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: "#374151"
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: "#6b7280"
              },
              grid: {
                color: "rgba(148,163,184,0.12)"
              }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: "#6b7280"
              },
              grid: {
                color: "rgba(148,163,184,0.12)"
              }
            }
          }
        }
      });
    }

    function calculate(){
      let initial = parseFloat(document.getElementById("initial").value) || 0;
      let monthly = parseFloat(document.getElementById("monthly").value) || 0;
      let years = parseFloat(document.getElementById("years").value) || 0;
      let rate = (parseFloat(document.getElementById("rate").value) || 0) / 100;

      let months = years * 12;
      let total = initial;
      let contributionTotal = initial;

      let labels = [];
      let totalValues = [];
      let contributionValues = [];

      for(let i = 0; i < months; i++){
        total = total * (1 + rate / 12) + monthly;
        contributionTotal += monthly;

        if ((i + 1) % 12 === 0) {
          labels.push("Year " + ((i + 1) / 12));
          totalValues.push(Number(total.toFixed(2)));
          contributionValues.push(Number(contributionTotal.toFixed(2)));
        }
      }

      let growthValue = total - contributionTotal;

      document.getElementById("finalValue").innerHTML = money(total);
      document.getElementById("contributions").innerHTML = money(contributionTotal);
      document.getElementById("growth").innerHTML = money(growthValue);

      drawChart({
        labels: labels,
        totalValues: totalValues,
        contributionValues: contributionValues
      });
    }

    function tryExample(){
      document.getElementById("initial").value = 1000;
      document.getElementById("monthly").value = 500;
      document.getElementById("years").value = 30;
      document.getElementById("rate").value = 8;
      calculate();
    }

    function resetForm(){
      document.getElementById("initial").value = "";
      document.getElementById("monthly").value = "";
      document.getElementById("years").value = "";
      document.getElementById("rate").value = "";

      document.getElementById("finalValue").innerHTML = "—";
      document.getElementById("contributions").innerHTML = "—";
      document.getElementById("growth").innerHTML = "—";

      if (growthChart) {
        growthChart.destroy();
        growthChart = null;
      }
    }

    calculate();
  </script>

</body>
</html>
