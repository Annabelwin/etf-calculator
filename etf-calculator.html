<!DOCTYPE html>
<html>
<head>
  <title>ETF Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#f7f7f8 0%, #eceef1 100%);
      text-align:center;
      padding:40px 20px;
      color:#16181d;
    }

    .container{
      background:linear-gradient(180deg,#ffffff 0%, #f3f4f6 100%);
      max-width:820px;
      margin:auto;
      padding:30px 30px 26px 30px;
      border-radius:22px;
      box-shadow:
        0 20px 50px rgba(15,23,42,0.10),
        inset 0 1px 0 rgba(255,255,255,0.9);
      border:1px solid rgba(148,163,184,0.18);
    }

    h1{
      margin-bottom:8px;
      font-size:44px;
      letter-spacing:-1px;
      color:#111827;
    }

    .sub{
      color:#6b7280;
      margin-bottom:22px;
      font-size:16px;
    }

    .form-box{
      max-width:460px;
      margin:0 auto 6px auto;
    }

    input{
      width:100%;
      padding:14px 16px;
      margin:8px 0;
      border-radius:12px;
      border:1px solid #d6dae1;
      font-size:16px;
      box-sizing:border-box;
      background:rgba(255,255,255,0.92);
      color:#111827;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
    }

    input:focus{
      outline:none;
      border-color:#7c8aa0;
      box-shadow:0 0 0 3px rgba(148,163,184,0.18);
    }

    .button-group{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    button{
      flex:1;
      padding:14px;
      border:none;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
      transition:all 0.18s ease;
    }

    .primary-btn{
      background:linear-gradient(180deg,#5b6c85 0%, #2f3c4f 100%);
      color:white;
      box-shadow:
        0 10px 20px rgba(31,41,55,0.18),
        inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .primary-btn:hover{
      transform:translateY(-1px);
      background:linear-gradient(180deg,#64748b 0%, #334155 100%);
    }

    .secondary-btn{
      background:linear-gradient(180deg,#f8fafc 0%, #e5e7eb 100%);
      color:#374151;
      border:1px solid rgba(148,163,184,0.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .secondary-btn:hover{
      transform:translateY(-1px);
      background:linear-gradient(180deg,#ffffff 0%, #eaeef3 100%);
    }

    .result-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:20px;
    }

    .stat{
      background:linear-gradient(180deg,#f9fafb 0%, #eef2f7 100%);
      border:1px solid rgba(148,163,184,0.16);
      border-radius:16px;
      padding:16px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .stat-label{
      font-size:13px;
      color:#6b7280;
      margin-bottom:8px;
    }

    .stat-value{
      font-size:22px;
      font-weight:700;
      color:#111827;
      word-break:break-word;
    }

    .chart-card{
      margin-top:18px;
      background:linear-gradient(180deg,#ffffff 0%, #f8fafc 100%);
      border-radius:18px;
      padding:16px;
      border:1px solid rgba(148,163,184,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .chart-title{
      text-align:left;
      font-size:15px;
      font-weight:600;
      color:#374151;
      margin-bottom:8px;
    }

    .back{
      margin-top:20px;
      display:inline-block;
      color:#475569;
      text-decoration:none;
      font-weight:600;
    }

    .back:hover{
      color:#111827;
    }

    @media (max-width: 760px){
      .container{
        padding:22px;
      }

      h1{
        font-size:36px;
      }

      .result-grid{
        grid-template-columns:1fr;
      }

      .button-group{
        flex-direction:column;
      }

      .stat-value{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
