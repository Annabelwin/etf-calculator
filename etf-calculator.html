<!DOCTYPE html>
<html>
<head>

<title>ETF Calculator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f5f5f7;
text-align:center;
padding:50px;
}

.container{
background:white;
max-width:420px;
margin:auto;
padding:30px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
margin-bottom:25px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#0071e3;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#0058b0;
}

.result{
margin-top:25px;
font-size:20px;
font-weight:600;
}

.back{
margin-top:25px;
display:block;
}

</style>

</head>

<body>

<div class="container">

<h1>ETF Calculator</h1>

<input id="initial" placeholder="Initial Investment ($)">
<input id="monthly" placeholder="Monthly Investment ($)">
<input id="years" placeholder="Years">
<input id="rate" placeholder="Annual Return (%)">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

<a class="back" href=" ">← Back to Home</a >

</div>

<script>

function calculate(){

let initial=parseFloat(document.getElementById("initial").value)||0;
let monthly=parseFloat(document.getElementById("monthly").value)||0;
let years=parseFloat(document.getElementById("years").value)||0;
let rate=parseFloat(document.getElementById("rate").value)/100||0;

let months=years*12;

let total=initial;

for(let i=0;i<months;i++){
total=total*(1+rate/12)+monthly;
}

document.getElementById("result").innerHTML=
"Future Value: $"+total.toFixed(2);

}

</script>

</body>
</html>
