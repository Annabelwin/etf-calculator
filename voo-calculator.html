<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOO Calculator</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
background:#f5f7fa;
margin:0;
padding:40px 20px;
color:#1d1d1f;
}

.container{
max-width:640px;
margin:auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

h1{
font-size:34px;
text-align:center;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#6e6e73;
margin-bottom:24px;
}

.info{
background:#f3f4f6;
padding:14px;
border-radius:10px;
margin-bottom:30px;
font-size:14px;
color:#555;
text-align:center;
}

.form-row{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.form-row label{
width:55%;
font-size:15px;
color:#374151;
}

.form-row input{
width:40%;
padding:10px;
border-radius:8px;
border:1px solid #d1d5db;
font-size:15px;
text-align:right;
}

.buttons{
margin-top:20px;
text-align:center;
}

button{
padding:10px 18px;
margin:6px;
border:none;
border-radius:8px;
font-size:14px;
cursor:pointer;
}

.calculate{
background:#2f3b52;
color:white;
}

.example{
background:#e5e7eb;
}

.reset{
background:#e5e7eb;
}

.results{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.result-box{
background:#f7f8fa;
padding:16px;
border-radius:10px;
flex:1;
margin:5px;
text-align:center;
}

.result-value{
font-size:22px;
font-weight:600;
}

.footer{
text-align:center;
margin-top:30px;
}

.footer a{
color:#4f46e5;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>VOO Calculator</h1>

<div class="sub">
Estimate long-term growth investing in Vanguard S&P 500 ETF
</div>

<div class="info">
VOO tracks the S&P 500 index and is one of the most popular long-term investment ETFs.
</div>


<div class="form-row">
<label>Initial Investment ($)</label>
<input id="initial" type="number">
</div>

<div class="form-row">
<label>Monthly Contribution ($)</label>
<input id="monthly" type="number">
</div>

<div class="form-row">
<label>Years</label>
<input id="years" type="number">
</div>

<div class="form-row">
<label>Annual Return (%)</label>
<input id="rate" type="number">
</div>


<div class="buttons">
<button class="calculate" onclick="calculate()">Calculate</button>
<button class="example" onclick="example()">Try Example</button>
<button class="reset" onclick="resetCalc()">Reset</button>
</div>


<div class="results">

<div class="result-box">
<div>Final Value</div>
<div class="result-value" id="final">$0</div>
</div>

<div class="result-box">
<div>Total Contributions</div>
<div class="result-value" id="contributions">$0</div>
</div>

<div class="result-box">
<div>Total Growth</div>
<div class="result-value" id="growth">$0</div>
</div>

</div>


<div class="footer">
<a href=" ">← Back to Home</a >
</div>

</div>


<script>

function calculate(){

let initial=parseFloat(document.getElementById("initial").value)||0
let monthly=parseFloat(document.getElementById("monthly").value)||0
let years=parseFloat(document.getElementById("years").value)||0
let rate=parseFloat(document.getElementById("rate").value)/100||0

let months=years*12
let balance=initial

for(let i=0;i<months;i++){
balance+=monthly
balance*=1+(rate/12)
}

let contributions=initial+(monthly*months)
let growth=balance-contributions

document.getElementById("final").innerText="$"+balance.toFixed(2)
document.getElementById("contributions").innerText="$"+contributions.toFixed(2)
document.getElementById("growth").innerText="$"+growth.toFixed(2)

}

function example(){
document.getElementById("initial").value=10000
document.getElementById("monthly").value=500
document.getElementById("years").value=20
document.getElementById("rate").value=10
}

function resetCalc(){
document.getElementById("initial").value=""
document.getElementById("monthly").value=""
document.getElementById("years").value=""
document.getElementById("rate").value=""
document.getElementById("final").innerText="$0"
document.getElementById("contributions").innerText="$0"
document.getElementById("growth").innerText="$0"
}

</script>

</body>
</html>
