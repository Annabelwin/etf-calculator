<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOO Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
background:#f5f6f8;
margin:0;
padding:40px 0;
color:#1d1d1f;
}

.container{
max-width:640px;
margin:auto;
}

.card{
background:white;
border-radius:14px;
padding:28px;
margin-bottom:24px;
box-shadow:0 4px 20px rgba(0,0,0,0.05);
}

h1{
text-align:center;
margin-bottom:6px;
}

.subtitle{
text-align:center;
color:#6e6e73;
margin-bottom:24px;
}

label{
font-size:14px;
color:#6e6e73;
}

.input-row{
display:flex;
justify-content:space-between;
margin-bottom:14px;
align-items:center;
}

input{
width:120px;
padding:8px;
border-radius:8px;
border:1px solid #ddd;
}

button{
padding:10px 18px;
border:none;
border-radius:10px;
background:#0a84ff;
color:white;
font-weight:600;
cursor:pointer;
}

button.secondary{
background:#e5e5ea;
color:#1d1d1f;
}

.result-big{
font-size:34px;
font-weight:700;
}

.result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:16px;
}

.result-box{
background:#f5f6f8;
padding:16px;
border-radius:10px;
}

.chart-title{
margin-bottom:10px;
color:#6e6e73;
font-size:14px;
}

.footer{
text-align:center;
margin-top:20px;
}

a{
color:#0a84ff;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h1>VOO Calculator</h1>
<div class="subtitle">
Estimate long-term growth investing in Vanguard S&P 500 ETF
</div>

<div class="card">

<div class="input-row">
<label>Initial Investment</label>
<input id="initial" value="10000">
</div>

<div class="input-row">
<label>Contribution Amount</label>
<input id="contribution" value="1500">
</div>

<div class="input-row">
<label>Invest Every (months)</label>
<input id="frequency" value="3">
</div>

<div class="input-row">
<label>Investment Period (years)</label>
<input id="years" value="20">
</div>

<div class="input-row">
<label>Expected Return (%)</label>
<input id="return" value="8">
</div>

<div class="input-row">
<label>Expense Ratio (%)</label>
<input id="fee" value="0.03">
</div>

<div class="input-row">
<label>Dividend Yield (%)</label>
<input id="dividend" value="1.4">
</div>

<div class="input-row">
<label>Inflation (%)</label>
<input id="inflation" value="2.5">
</div>

<br>

<button onclick="calculate()">Calculate</button>

</div>


<div class="card">

<div class="chart-title">Final Portfolio Value</div>
<div class="result-big" id="final">$0</div>

<div class="result-grid">

<div class="result-box">
<div>Total Contributions</div>
<div id="contributions">$0</div>
</div>

<div class="result-box">
<div>Total Gain</div>
<div id="gain">$0</div>
</div>

<div class="result-box">
<div>Estimated Fees</div>
<div id="fees">$0</div>
</div>

<div class="result-box">
<div>Real Value (after inflation)</div>
<div id="real">$0</div>
</div>

</div>

</div>


<div class="card">

<div class="chart-title">VOO Growth Over Time</div>

<canvas id="chart"></canvas>

</div>


<div class="card">

<h3>Investment Insights</h3>

<p id="insight"></p >

</div>

<div class="footer">
<a href="https://etfcalculator.net">← Back to Home</a>
</div>

</div>


<script>

let chart;

function calculate(){

let initial=Number(document.getElementById("initial").value)
let contribution=Number(document.getElementById("contribution").value)
let freq=Number(document.getElementById("frequency").value)
let years=Number(document.getElementById("years").value)

let r = Number(document.getElementById("return").value) / 100
let fee = Number(document.getElementById("fee").value) / 100
let inflation = Number(document.getElementById("inflation").value) / 100
let months=years*12

let balance=initial
let contributions=initial

let values=[]
let contribs=[]

for(let m=1;m<=months;m++){

balance*=1+(r/12)

balance*=1-(fee/12)

if(m%freq==0){

balance+=contribution
contributions+=contribution

}

if(m%12==0){

values.push(balance)
contribs.push(contributions)

}

}

let gain=balance-contributions

let real=balance/Math.pow(1+inflation,years)

document.getElementById("final").innerText="$"+balance.toFixed(0)

document.getElementById("contributions").innerText="$"+contributions.toFixed(0)

document.getElementById("gain").innerText="$"+gain.toFixed(0)

document.getElementById("fees").innerText="$"+(balance*fee*years).toFixed(0)

document.getElementById("real").innerText="$"+real.toFixed(0)

document.getElementById("insight").innerText=

"Over "+years+" years your portfolio could grow to about $"+balance.toFixed(0)+
". You would invest $"+contributions.toFixed(0)+
" while compounding could add roughly $"+gain.toFixed(0)+
". After inflation, the real purchasing power may be around $"+real.toFixed(0)+".";


let labels=[]

for(let i=1;i<=years;i++){

labels.push("Year "+i)

}

if(chart) chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{

labels:labels,

datasets:[

{

label:"Portfolio Value",

data:values,

borderColor:"#0a84ff",

tension:0.3

},

{

label:"Contributions",

data:contribs,

borderColor:"#b0b0b5",

tension:0.3

}

]

},

options:{responsive:true}

})

}

calculate()

</script>

</body>

</html>
