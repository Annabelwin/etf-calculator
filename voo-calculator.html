<!DOCTYPE html>
<html>
<head>
  <title>VOO Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#f7f7f8 0%, #eceef1 100%);
      text-align:center;
      padding:40px 20px;
      color:#16181d;
    }

    .container{
      background:linear-gradient(180deg,#ffffff 0%, #f3f4f6 100%);
      max-width:820px;
      margin:auto;
      padding:30px;
      border-radius:22px;
      box-shadow:
        0 20px 50px rgba(15,23,42,0.10),
        inset 0 1px 0 rgba(255,255,255,0.9);
      border:1px solid rgba(148,163,184,0.18);
    }

    h1{
      margin-bottom:6px;
      font-size:44px;
      letter-spacing:-1px;
      color:#111827;
    }

    .sub{
      color:#6b7280;
      margin-bottom:22px;
      font-size:16px;
    }

    .info{
      background:#eef2f7;
      padding:12px;
      border-radius:10px;
      margin-bottom:18px;
      font-size:14px;
      color:#374151;
    }

    .form-box{
      max-width:460px;
      margin:0 auto;
    }

    input{
      width:100%;
      padding:14px 16px;
      margin:8px 0;
      border-radius:12px;
      border:1px solid #d6dae1;
      font-size:16px;
      box-sizing:border-box;
      background:rgba(255,255,255,0.92);
    }

    .button-group{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    button{
      flex:1;
      padding:14px;
      border:none;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
    }

    .primary-btn{
      background:linear-gradient(180deg,#5b6c85 0%, #2f3c4f 100%);
      color:white;
    }

    .secondary-btn{
      background:#e5e7eb;
      color:#374151;
    }

    .result-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:20px;
    }

    .stat{
      background:#f3f4f6;
      border-radius:12px;
      padding:14px;
    }

    .stat-label{
      font-size:13px;
      color:#6b7280;
      margin-bottom:6px;
    }

    .stat-value{
      font-size:20px;
      font-weight:700;
    }

    .chart-card{
      margin-top:20px;
    }

    .back{
      margin-top:20px;
      display:inline-block;
      text-decoration:none;
      color:#374151;
      font-weight:600;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>VOO Calculator</h1>

    <div class="sub">
      Estimate long-term returns investing in Vanguard S&P 500 ETF (VOO)
    </div>

    <div class="info">
      VOO tracks the S&P 500 index. Historically the S&P 500 has returned about
      <b>9-10% annually</b> over the long term.
    </div>

    <div class="form-box">

      <input id="initial" placeholder="Initial Investment ($)" value="10000">
      <input id="monthly" placeholder="Monthly Investment ($)" value="500">
      <input id="years" placeholder="Years" value="20">
      <input id="rate" placeholder="Expected Return (%)" value="10">

      <div class="button-group">
        <button class="primary-btn" onclick="calculate()">Calculate</button>
        <button class="secondary-btn" onclick="tryExample()">Example</button>
        <button class="secondary-btn" onclick="resetForm()">Reset</button>
      </div>

    </div>

    <div class="result-grid">

      <div class="stat">
        <div class="stat-label">Final Value</div>
        <div class="stat-value" id="finalValue">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Contributions</div>
        <div class="stat-value" id="contributions">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Growth</div>
        <div class="stat-value" id="growth">—</div>
      </div>

    </div>

    <div class="chart-card">
      <canvas id="chart"></canvas>
    </div>

    <a class="back" href=" ">← Back to Home</a >

  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let growthChart = null;

function money(n){
  return "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:2});
}

function calculate(){

  let initial=parseFloat(document.getElementById("initial").value)||0;
  let monthly=parseFloat(document.getElementById("monthly").value)||0;
  let years=parseFloat(document.getElementById("years").value)||0;
  let rate=(parseFloat(document.getElementById("rate").value)||0)/100;

  let months=years*12;
  let total=initial;
  let contributionTotal=initial;

  let labels=[];
  let totalValues=[];
  let contributionValues=[];

  for(let i=0;i<months;i++){

    total=total*(1+rate/12)+monthly;
    contributionTotal+=monthly;

    if((i+1)%12===0){

      labels.push("Year "+((i+1)/12));
      totalValues.push(Number(total.toFixed(2)));
      contributionValues.push(Number(contributionTotal.toFixed(2)));

    }

  }

  let growthValue=total-contributionTotal;

  document.getElementById("finalValue").innerHTML=money(total);
  document.getElementById("contributions").innerHTML=money(contributionTotal);
  document.getElementById("growth").innerHTML=money(growthValue);

  drawChart(labels,totalValues,contributionValues);

}

function drawChart(labels,totalValues,contributionValues){

  const ctx=document.getElementById("chart");

  if(growthChart){growthChart.destroy();}

  growthChart=new Chart(ctx,{
    type:'line',
    data:{
      labels:labels,
      datasets:[
        {
          label:'Total Value',
          data:totalValues,
          borderColor:'#3b82f6',
          tension:0.3
        },
        {
          label:'Contributions',
          data:contributionValues,
          borderColor:'#94a3b8',
          tension:0.2
        }
      ]
    }
  });

}

function tryExample(){
  calculate();
}

function resetForm(){

  document.getElementById("initial").value="";
  document.getElementById("monthly").value="";
  document.getElementById("years").value="";
  document.getElementById("rate").value="";

}

calculate();

</script>

</body>
</html>
